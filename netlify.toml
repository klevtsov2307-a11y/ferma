[build]
  command = "node scripts/build-catalog.mjs"
  publish = "dist"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
